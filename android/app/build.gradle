plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mypdf.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.mypdf.app"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "2.0"
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Signed with this computer's debug key so the APK can be installed directly (sideloaded).
            signingConfig signingConfigs.debug
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')   // one Kotlin version for all libraries
    implementation 'androidx.core:core:1.13.1'                         // FileProvider
    implementation 'androidx.webkit:webkit:1.12.1'                     // serve the bundled app over https://appassets…
    implementation 'androidx.exifinterface:exifinterface:1.3.7'        // photo rotation
    implementation 'com.google.mlkit:text-recognition:16.0.1'          // on-device OCR (bundled model, offline)
}
